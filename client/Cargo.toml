[package]
name = "jotihunt-client"
version = "0.1.0"
edition = "2021"

[profile.release]
lto = true
opt-level = 's'

[dependencies]
jotihunt-shared = { path = "../shared" }
wasm-bindgen = { version = "0.2.129", default-features = false }
web-sys = { version = "0.3.106", default-features = false, features = ["SpeechSynthesisUtterance", "Window", "SpeechSynthesis", "HtmlElement", "HtmlInputElement", "HtmlFormElement", "History", "Location", "Url"] }
js-sys = { version = "0.3.106", default-features = false }
sycamore = { version = "0.9.4", features = ["suspense", "web"], default-features = false }
gloo = { version = "0.12.0", features = ["futures"] }
serde = { version = "1.0.229", default-features = false }
serde_json = "1.0"
futures = { version = "0.3.34", default-features = false }
console_error_panic_hook = "0.1.7"
mk-geolocation = {git = "https://gitlab.com/mkroehnert/mk-geolocation", features= ["futures"]}
merging-iterator = "1.3.0"
