<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover lets the map run under the notch, the panels keep clear of it with safe-area insets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#006400">
    <title>Jotihunt!</title>

    <!-- installable as an app, see manifest.webmanifest and sw.js -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link data-trunk rel="copy-file" href="manifest.webmanifest" />
    <link data-trunk rel="copy-file" href="sw.js" />
    <link data-trunk rel="copy-file" href="icon-192.png" />
    <link data-trunk rel="copy-file" href="icon-512.png" />
    <link data-trunk rel="copy-file" href="apple-touch-icon.png" />
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("sw.js");
        }
    </script>
    <link data-trunk rel="copy-file" href="stikkerbuilding.png" />
    <link data-trunk rel="copy-file" href="human.png" />
    <link data-trunk rel="copy-file" href="fox.svg" />
    <link data-trunk rel="copy-file" href="pin.svg" />
    <link data-trunk rel="scss" href="index.scss" />
    <link data-trunk rel="rust" data-wasm-opt="s" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.8.0/proj4.js"
        integrity="sha512-ha3Is9IgbEyIInSb+4S6IlEwpimz00N5J/dVLQFKhePkZ/HywIbxLeEu5w+hRjVBpbujTogNyT311tluwemy9w=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>

<body>
    <div id="panel_column">
        <!-- a normal form post, so password managers fill and save the password like on any site,
             the server redirects back to `redirect` -->
        <form id="login" method="post" hidden>
            <input id="redirect" name="redirect" type="hidden" />
            <label for="password">Wachtwoord:</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
        </form>
        <details id="coord_editor"></details>
        <details id="articles"></details>
        <details id="option_panel"></details>
    </div>
    <div id="map"></div>
    <div id="page"></div>
</body>

</html>
