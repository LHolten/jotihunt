[package]
name = "server"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
futures-util = { version = "0.3.34", default-features = false }
async-stream = "0.3.6"
jotihunt-shared = { path = "../shared" }
serde = { version = "1.0.229", features = ["derive"] }
uuid = { version = "1.28.0", features = ["serde"], default-features = false }

axum = { version = "0.8", features = ["query", "form", "tokio", "http1", "json"], default-features = false }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "sync"], default-features = false }
tower-http = { version = "0.7.1", features = ["cors", "request-id"], default-features = false }
clap = { version = "4.6.7", features = ["derive", "std"], default-features = false }
reqwest = { version = "0.13.5", features = ["json", "rustls"], default-features = false }
serde_json = "1.0"
arc-swap = "1.9.2"
rust-query = "0.10.0"

# there is no system sqlite to link against on windows, so it is compiled from source
[target.'cfg(windows)'.dependencies]
rust-query = { version = "0.10.0", features = ["bundled"] }
